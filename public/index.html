<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment Submission Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ice:#EAF4FB; --ice-2:#D4E8F6; --frost:#F8FBFE;
    --navy:#0A2342; --navy-2:#12386B; --steel:#3C74A8; --mist:#8FB3D6;
    --ok:#1E7F5C; --bad:#B3374A;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Manrope,system-ui,sans-serif;color:var(--navy);
    background:radial-gradient(1000px 500px at 85% -10%,#fff 0%,transparent 60%),linear-gradient(160deg,var(--ice),var(--ice-2));}
  .shell{display:grid;grid-template-columns:minmax(320px,430px) 1fr;min-height:100vh}
  aside{background:linear-gradient(170deg,var(--navy),var(--navy-2));color:#fff;padding:48px 40px;display:flex;flex-direction:column;gap:28px}
  h1{font-family:Fraunces,Georgia,serif;font-size:2.1rem;line-height:1.15;margin:0}
  aside p.lead{margin:0;color:var(--mist);line-height:1.6;max-width:34ch}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:var(--ice-2)}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2c5589;background:rgba(255,255,255,.07);color:#fff;font:inherit;margin-bottom:16px;transition:border-color .2s, background .2s}
  input::placeholder{color:#7fa3c9}
  input:focus{outline:none;border-color:var(--ice);background:rgba(255,255,255,.13);box-shadow:0 0 0 3px rgba(143,179,214,.35)}
  button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ice);color:var(--navy);font:600 1rem Manrope,sans-serif;cursor:pointer;transition:transform .15s, background .2s}
  button:hover{background:#fff;transform:translateY(-1px)} button:focus-visible{outline:3px solid var(--mist);outline-offset:2px}
  #msg{min-height:1.4em;margin:14px 0 0;font-size:.92rem;line-height:1.5}
  #msg.err{color:#FFB4C0} #msg.ok{color:#9FE3C5}
  main{padding:48px clamp(20px,5vw,64px)}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px}
  h2{font-family:Fraunces,Georgia,serif;font-size:1.6rem;margin:0}
  .badge{font-size:.8rem;color:var(--steel);background:var(--frost);border:1px solid var(--ice-2);padding:5px 12px;border-radius:99px}
  .list{display:grid;gap:14px}
  .item{background:var(--frost);border:1px solid var(--ice-2);border-left:5px solid var(--steel);border-radius:14px;padding:18px 20px;box-shadow:0 6px 18px rgba(10,35,66,.06)}
  .item h3{margin:0 0 4px;font-size:1.05rem}
  .meta{font-size:.88rem;color:#4a6585;margin-bottom:8px}
  .item a{color:var(--navy-2);font-weight:600;word-break:break-all}
  .time{font-size:.78rem;color:#7a93ad;margin-top:8px}
  .empty{padding:40px;border:2px dashed var(--mist);border-radius:14px;color:#4a6585;text-align:center}
  @media(max-width:820px){.shell{grid-template-columns:1fr} aside{padding:32px 22px} main{padding:32px 20px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div>
      <h1>Assignment Submission Portal</h1>
      <p class="lead">Share your assignment link below. Your instructor sees it in the list right away.</p>
    </div>
    <form id="f" novalidate>
      <label for="name">Student name</label>
      <input id="name" placeholder="e.g. Malaika Naz" autocomplete="name">
      <label for="regNo">Registration number</label>
      <input id="regNo" placeholder="e.g. FA23-BAI-063">
      <label for="title">Assignment title</label>
      <input id="title" placeholder="e.g. DevOps Lab Mid">
      <label for="url">Submission URL</label>
      <input id="url" placeholder="https://github.com/you/your-repo">
      <button type="submit">Submit assignment</button>
      <p id="msg" role="status"></p>
    </form>
  </aside>
  <main>
    <div class="head"><h2>Submitted assignments</h2><span class="badge" id="count">0 submissions</span></div>
    <div class="list" id="list"></div>
  </main>
</div>

<script>
// Same rules as src/validate.js (server is still the real gatekeeper).
function validate(d){
  const labels={name:'Student name',regNo:'Registration number',title:'Assignment title',url:'Submission URL'};
  const errors=[];
  for(const k in labels) if(!d[k].trim()) errors.push(labels[k]+' is required');
  if(d.url.trim()){
    try{const u=new URL(d.url.trim());
      if(!/^https?:$/.test(u.protocol)||!(u.hostname==='localhost'||u.hostname.includes('.'))) throw 0;
    }catch{errors.push('Submission URL must be a valid http or https link');}
  }
  return errors;
}

const API='api/submissions';
let demoMode=false;   // true on GitHub Pages (no backend) -> uses localStorage
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){
  try{
    const r=await fetch(API); if(!r.ok) throw 0;
    return await r.json();
  }catch{
    demoMode=true;
    return JSON.parse(localStorage.getItem('demo-submissions')||'[]');
  }
}

function render(list){
  $('count').textContent=list.length+(list.length===1?' submission':' submissions')+(demoMode?' (demo)':'');
  $('list').innerHTML=list.length?list.slice().reverse().map(s=>`
    <article class="item">
      <h3>${esc(s.title)}</h3>
      <div class="meta">${esc(s.name)} &middot; ${esc(s.regNo)}</div>
      <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a>
      <div class="time">Submitted ${new Date(s.submittedAt).toLocaleString()}</div>
    </article>`).join(''):'<div class="empty">No submissions yet. The first one will appear here.</div>';
}

function say(text,type){$('msg').textContent=text;$('msg').className=type;}

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const data={};['name','regNo','title','url'].forEach(k=>data[k]=$(k).value);
  const errors=validate(data);
  if(errors.length) return say(errors.join('. ')+'.','err');

  if(demoMode){
    const list=JSON.parse(localStorage.getItem('demo-submissions')||'[]');
    list.push({id:Date.now(),...data,submittedAt:new Date().toISOString()});
    localStorage.setItem('demo-submissions',JSON.stringify(list));
  }else{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const body=await r.json();
    if(!r.ok) return say(body.errors.join('. ')+'.','err');
  }
  $('f').reset(); say('Assignment submitted successfully.','ok');
  render(await load());
});

load().then(render);
</script>
</body>
</html>
